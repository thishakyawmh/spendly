name: CI

on:
  pull_request:
    branches: [main, master, "audit/**"]
  push:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Report dependency advisories
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(name + ": " + v.severity + " | range=" + v.range + " | fix=" + JSON.stringify(v.fixAvailable));'
      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          find . -path './node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
